<html lang="en">
  <head>

    <link rel="stylesheet" href="login.css" />

    <title>login page</title>

  <body>
    <div class="container">
      <button>
        <a href="login.html"><i class="fa fa-arrow-left"></i></a>
      </button>
       
    </div>
    <article>
        <div class="login">
            <h1>register now</h1>
            <div class="textbox">
                <input type="text" name="username" placeholder="first name" required="required">
                 
            </div>
            <div class="textbox">
                <input type="text" name="username" placeholder="family name" required="required">
                
            </div>
             
                <div class="textbox">
                    <input type="email" name="username" placeholder="e-mail" required="required">
                    <i class="fa fa-user"></i>
                </div>
                <div class="textbox">
                    <input type="password" name="password" placeholder="Password" required="required">
                
                    <i class="fa fa-lock"></i></div>
                    <p>confirm your password</p>
                    <div class="textbox">
                        <input type="password" name="password" placeholder="Password" required="required">
                    
                        <i class="fa fa-lock"></i></div>
                <input  type="submit" class="btn" value="confirm"  >
                 
                    
        </div>
    </article>
  </body>
